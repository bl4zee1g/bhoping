<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meow :3</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c9ced8 url(assets/img/meow.jpg) center/cover no-repeat;}
  /* dark falloff toward the edges, lighter centre, so the viewmodel reads against the backdrop */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(75% 65% at 55% 45%,transparent 35%,#07080999 100%)}
  /* bhop silhouette centred behind the viewmodel, no ring */
  #emblem{position:fixed;left:50%;top:50%;height:min(44vh,44vw);transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
  #emblem img{height:100%;width:auto;display:block}
  canvas{display:block;width:100%;height:100%;position:relative;z-index:1}
</style>
</head>
<body>
<div id="emblem"><img src="assets/img/bhop_silhouette.png" alt=""></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="./main.js"></script>
</body>
</html>
